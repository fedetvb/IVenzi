appId: com.gestionale.salone
productName: Gestionale Salone
copyright: Copyright © 2025

# Directory dell'app compilata da Vite
directories:
  output: dist-electron

# File da includere nel pacchetto
files:
  - dist/**/*
  - electron/main.js
  - electron/preload.js
  - package.json

# Punto di ingresso
extraMetadata:
  main: electron/main.js

# Icona condivisa (electron-builder converte automaticamente in .ico / .icns)
icon: public/icons/icon-512x512.png

# ── Windows ───────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  language: 1040
  shortcutName: Gestionale Salone
  createDesktopShortcut: true
  createStartMenuShortcut: true

# ── macOS ─────────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.business

dmg:
  title: Gestionale Salone

# ── Linux ─────────────────────────────────────────────────────────────────────
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office

# ── Auto-update (opzionale, configurare in futuro) ────────────────────────────
