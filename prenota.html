<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2C3E2B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyVenzi" />
    <link rel="manifest" href="/prenota-manifest.json" />
    <link rel="icon" type="image/png" href="/icons/pwa-portale.png" />
    <link rel="apple-touch-icon" href="/icons/pwa-portale.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/pwa-portale.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/pwa-portale.png" />
    <title>MyVenzi</title>

    <script>
      // ── Android TWA Password Wall ─────────────────────────────────────────────
      (function () {
        // 1. Solo se l'app è aperta dall'app Android (TWA / Play Store)
        if (document.referrer.indexOf('android-app://') === -1) return;

        var SB_URL = 'https://qfpeffzdszdanebmgafb.supabase.co';
        var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmcGVmZnpkc3pkYW5lYm1nYWZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0NjI4MDUsImV4cCI6MjA5NTAzODgwNX0.RQ77EhEJxVN02WQWUH9XiBUvRMysxgBVFQSi1UlqhKM';

        // 2. Scheda cliente già registrata su questo dispositivo?
        try {
          var raw = localStorage.getItem('prenota_online_cliente_v1');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && (parsed.id || parsed.nome)) return;
          }
        } catch (e) {}

        // 3. App già sbloccata in una sessione precedente?
        //    Ma controlla anche se l'admin ha richiesto reset a tutti (app_password_reset_at)
        if (localStorage.getItem('app_sbloccata') === 'true') {
          var sbloccataAt = localStorage.getItem('app_sbloccata_at');
          // Verifica se la password è stata resettata dopo l'ultimo sblocco
          fetch(SB_URL + '/rest/v1/system_settings?select=setting_value&setting_key=eq.app_password_reset_at&limit=1', {
            headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
          })
          .then(function(r) { return r.ok ? r.json() : []; })
          .then(function(rows) {
            var resetAt = rows && rows.length ? rows[0].setting_value : null;
            if (resetAt && sbloccataAt && resetAt > sbloccataAt) {
              // Admin ha resettato per tutti dopo l'ultimo sblocco: richiedi password
              localStorage.removeItem('app_sbloccata');
              localStorage.removeItem('app_sbloccata_at');
              avviaPasswordWall();
            }
            // altrimenti niente da fare, l'app è già sbloccata
          })
          .catch(function() {
            // In caso di errore di rete lascia passare (app già sbloccata)
          });
          return;
        }

        // 4. Blocco: nascondi il rendering React e mostra la schermata di sblocco
        document.documentElement.style.overflow = 'hidden';
        var blockStyle = document.createElement('style');
        blockStyle.textContent = '#root { visibility: hidden !important; }';
        document.head.appendChild(blockStyle);

        function sblocca() {
          localStorage.setItem('app_sbloccata', 'true');
          localStorage.setItem('app_sbloccata_at', new Date().toISOString());
          var wall = document.getElementById('password-wall');
          if (wall) wall.remove();
          document.documentElement.style.overflow = '';
          blockStyle.remove();
        }

        function avviaPasswordWall() {
          document.documentElement.style.overflow = 'hidden';
          var bs = document.createElement('style');
          bs.textContent = '#root { visibility: hidden !important; }';
          document.head.appendChild(bs);
          window.__showPasswordWall(bs);
        }

        // 5. Controlla se il numero di telefono salvato esiste già nella rubrica clienti
        //    (cliente esistente = no password richiesta)
        try {
          var clienteRaw = localStorage.getItem('prenota_online_telefono_v1') ||
                           localStorage.getItem('prenota_telefono') ||
                           null;
          // Prova anche a estrarre da altri formati salvati
          if (!clienteRaw) {
            var altri = ['myvenzi_cliente', 'cliente_myvenzi', 'prenota_cliente'];
            for (var i = 0; i < altri.length; i++) {
              var tmp = localStorage.getItem(altri[i]);
              if (tmp) { clienteRaw = tmp; break; }
            }
          }
        } catch(e) { clienteRaw = null; }

        if (clienteRaw) {
          // Prova a estrarre il telefono
          var telefono = null;
          try {
            var cp = JSON.parse(clienteRaw);
            telefono = cp.telefono || cp.phone || cp.tel || null;
          } catch(e) { telefono = clienteRaw; }

          if (telefono) {
            fetch(SB_URL + '/rest/v1/rpc/cliente_esiste_in_rubrica', {
              method: 'POST',
              headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
              body: JSON.stringify({ p_telefono: String(telefono) })
            })
            .then(function(r) { return r.ok ? r.json() : false; })
            .then(function(esiste) {
              if (esiste === true) {
                sblocca(); // cliente in rubrica: nessuna password
              } else {
                window.__showPasswordWall(blockStyle);
              }
            })
            .catch(function() {
              window.__showPasswordWall(blockStyle);
            });
            return;
          }
        }

        // 6. Nessun dato: mostra la schermata password
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () { window.__showPasswordWall(blockStyle); });
        } else {
          window.__showPasswordWall(blockStyle);
        }

        function fetchAppPassword() {
          return fetch(SB_URL + '/rest/v1/system_settings?select=setting_value&setting_key=eq.app_unlock_password&limit=1', {
            headers: {
              'apikey': SB_KEY,
              'Authorization': 'Bearer ' + SB_KEY,
            }
          })
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (rows) { return (rows && rows.length) ? rows[0].setting_value : null; })
          .catch(function () { return null; });
        }

        window.__showPasswordWall = function (bStyle) {
          var wall = document.createElement('div');
          wall.id = 'password-wall';
          wall.innerHTML = [
            '<div style="',
              'position:fixed;inset:0;background:#E2F4E5;',
              'display:flex;flex-direction:column;align-items:center;justify-content:center;',
              'z-index:99999;padding:32px 24px;font-family:system-ui,sans-serif;">',

              '<img src="/icons/myvenzi-192.png" alt="MyVenzi"',
              ' style="width:96px;height:96px;border-radius:24px;',
              'box-shadow:0 4px 24px rgba(44,62,43,.18);margin-bottom:28px;" />',

              '<h1 style="margin:0 0 6px;font-size:26px;font-weight:700;color:#2C3E2B;">MyVenzi</h1>',
              '<p style="margin:0 0 36px;font-size:14px;color:#4a6b49;text-align:center;">',
                'Inserisci il codice di accesso per continuare',
              '</p>',

              '<div id="pw-error" style="',
                'display:none;margin-bottom:16px;padding:10px 18px;',
                'background:#fde8e8;color:#b91c1c;border-radius:12px;',
                'font-size:13px;text-align:center;">',
                'Codice errato. Riprova.',
              '</div>',

              '<input id="pw-input" type="password" placeholder="Codice di accesso" disabled',
              ' style="',
                'width:100%;max-width:320px;padding:14px 18px;',
                'border:2px solid #b8d9ba;border-radius:14px;',
                'font-size:16px;outline:none;background:#fff;color:#2C3E2B;',
                'box-sizing:border-box;margin-bottom:14px;',
                'transition:border-color .2s,opacity .2s;opacity:.5;" />',

              '<button id="pw-btn" disabled style="',
                'width:100%;max-width:320px;padding:15px;',
                'background:#2C3E2B;color:#fff;opacity:.5;',
                'border:none;border-radius:14px;',
                'font-size:16px;font-weight:600;cursor:not-allowed;',
                'transition:background .2s,opacity .2s;">',
                'Verifica in corso…',
              '</button>',
            '</div>'
          ].join('');

          document.body.appendChild(wall);

          var input = document.getElementById('pw-input');
          var btn   = document.getElementById('pw-btn');
          var errEl = document.getElementById('pw-error');
          var correctPwd = null;

          // Fetch della password dalla tabella system_settings
          fetchAppPassword().then(function (pwd) {
            correctPwd = pwd;
            input.disabled = false;
            input.style.opacity = '1';
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.style.cursor = 'pointer';
            btn.textContent = 'Sblocca';
            input.focus();
          });

          input.addEventListener('focus', function () { input.style.borderColor = '#2C3E2B'; });
          input.addEventListener('blur',  function () { input.style.borderColor = '#b8d9ba'; });

          function tryUnlock() {
            if (!correctPwd) return;
            if (input.value === correctPwd) {
              sblocca();
            } else {
              errEl.style.display = 'block';
              input.value = '';
              input.focus();
              btn.style.background = '#4a6b49';
              setTimeout(function () { btn.style.background = '#2C3E2B'; }, 600);
            }
          }

          btn.addEventListener('click', tryUnlock);
          input.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });
        };

      })();

      // ── Cattura beforeinstallprompt prima che React monta ────────────────────
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js', { scope: '/' });
        });
      }
    </script>
  </body>
</html>
