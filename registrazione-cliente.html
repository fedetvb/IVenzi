<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scheda Cliente</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#fafaf9 0%,#fffbeb 100%);min-height:100vh;color:#1c1917}
.header{background:white;border-bottom:1.5px solid #e7e5e4;padding:20px 24px;text-align:center;position:sticky;top:0;z-index:10}
.hi{display:inline-flex;align-items:center;gap:10px;margin-bottom:4px}
.logo{width:36px;height:36px;background:#f59e0b;border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(245,158,11,.3)}
.logo svg{width:18px;height:18px;fill:none;stroke:white;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.header h1{font-size:18px;font-weight:700;color:#1c1917}
.header p{font-size:13px;color:#78716c}
.container{max-width:460px;margin:0 auto;padding:28px 20px 48px}
.fg{margin-bottom:18px}
label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#57534e;margin-bottom:6px}
.req{color:#f87171}
.iw{position:relative}
.ii{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:#a8a29e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ti{top:14px;transform:none}
input,textarea,select{width:100%;padding:13px 16px 13px 44px;background:white;border:1.5px solid #e7e5e4;border-radius:14px;font-size:14px;color:#1c1917;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;font-family:inherit}
input:focus,textarea:focus{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.15)}
input::placeholder,textarea::placeholder{color:#c4bfbb}
textarea{resize:none;padding-top:13px;line-height:1.5}
.privacy{font-size:12px;color:#a8a29e;line-height:1.7;margin-bottom:22px;padding:12px 14px;background:#fafaf9;border-radius:10px;border:1px solid #f0ece8}
.btn{width:100%;padding:16px;background:#f59e0b;color:white;font-size:15px;font-weight:700;border:none;border-radius:14px;cursor:pointer;transition:background .15s,transform .1s,box-shadow .15s;box-shadow:0 4px 14px rgba(245,158,11,.35);letter-spacing:.01em}
.btn:hover{background:#e89000;box-shadow:0 6px 18px rgba(245,158,11,.4)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.eb{display:flex;align-items:center;gap:10px;background:#fef2f2;border:1.5px solid #fecaca;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#dc2626}
.eb svg{flex-shrink:0;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ss{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;padding:40px 24px}
.si{width:88px;height:88px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:0 4px 20px rgba(22,163,74,.2)}
.si svg{width:40px;height:40px;fill:none;stroke:#16a34a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ss h2{font-size:28px;font-weight:800;color:#1c1917;margin-bottom:12px}
.ss p{font-size:15px;color:#78716c;line-height:1.7;max-width:290px}
.sf{margin-top:32px;display:inline-flex;align-items:center;gap:8px;color:#f59e0b;font-size:14px;font-weight:700;background:#fffbeb;padding:10px 20px;border-radius:50px;border:1.5px solid #fde68a}
.sf svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.divider{height:1px;background:#f0ece8;margin:8px 0 22px}
.section-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#a8a29e;margin-bottom:14px;margin-top:6px}
</style>
</head>
<body>
<div class="header">
  <div class="hi">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M6 3c1.5 0 3 1.5 3 3S6 12 6 12 3 9 3 6s1.5-3 3-3z"/><path d="M18 3c1.5 0 3 1.5 3 3s-3 6-3 6-3-3-3-6 1.5-3 3-3z"/><path d="M6 12l6 9 6-9"/></svg>
    </div>
    <h1>Scheda Cliente</h1>
  </div>
  <p>Compila il modulo per registrarti</p>
</div>

<div id="app">
  <div class="container">
    <form id="f" novalidate>
      <p class="section-title">Dati personali</p>

      <div class="fg">
        <label>Nome <span class="req">*</span></label>
        <div class="iw">
          <svg class="ii" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <input type="text" id="nome" placeholder="Il tuo nome" autocomplete="given-name" />
        </div>
      </div>

      <div class="fg">
        <label>Cognome <span class="req">*</span></label>
        <div class="iw">
          <svg class="ii" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <input type="text" id="cognome" placeholder="Il tuo cognome" autocomplete="family-name" />
        </div>
      </div>

      <div class="fg">
        <label>Data di nascita</label>
        <div class="iw">
          <svg class="ii" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <input type="date" id="dn" autocomplete="bday" />
        </div>
      </div>

      <div class="divider"></div>
      <p class="section-title">Contatti</p>

      <div class="fg">
        <label>Telefono</label>
        <div class="iw">
          <svg class="ii" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
          <input type="tel" id="telefono" placeholder="+39 333 000 0000" autocomplete="tel" />
        </div>
      </div>

      <div class="fg">
        <label>Email</label>
        <div class="iw">
          <svg class="ii" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" id="email" placeholder="nome@esempio.it" autocomplete="email" />
        </div>
      </div>

      <div class="divider"></div>
      <p class="section-title">Note aggiuntive</p>

      <div class="fg">
        <label>Allergie / Preferenze</label>
        <div class="iw">
          <svg class="ii ti" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <textarea id="note" rows="3" placeholder="Allergie, preferenze, informazioni utili..."></textarea>
        </div>
      </div>

      <div id="err" class="eb" style="display:none">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="em"></span>
      </div>

      <p class="privacy">I tuoi dati saranno utilizzati esclusivamente per la gestione della scheda cliente nel salone e non saranno ceduti a terzi. Puoi richiederne la cancellazione in qualsiasi momento.</p>

      <button type="submit" class="btn" id="btn">Invia la mia scheda</button>
    </form>
  </div>
</div>

<script>
var SU = "https://cfsourwsjhhriytkdnuw.supabase.co";
var SK = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmc291cndzamhocml5dGtkbnV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5MjEzMDksImV4cCI6MjA5NDQ5NzMwOX0.XXTX5NYTIYF-Dn9-iA-YgJQd8G4CVKPTedoBscD1OOI";

document.getElementById("f").onsubmit = async function(e) {
  e.preventDefault();
  var n  = document.getElementById("nome").value.trim();
  var c  = document.getElementById("cognome").value.trim();
  var t  = document.getElementById("telefono").value.trim();
  var em = document.getElementById("email").value.trim();
  var d  = document.getElementById("dn").value || null;
  var no = document.getElementById("note").value.trim();
  var ed = document.getElementById("err");
  var emsg = document.getElementById("em");
  var btn = document.getElementById("btn");

  if (!n || !c) {
    emsg.textContent = "Nome e cognome sono obbligatori.";
    ed.style.display = "flex";
    return;
  }

  ed.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Invio in corso...";

  try {
    var r = await fetch(SU + "/rest/v1/schede_clienti_da_confermare", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SK,
        "Authorization": "Bearer " + SK,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({
        nome: n,
        cognome: c,
        telefono: t || null,
        email: em || null,
        data_nascita: d,
        note: no || null,
        stato: "in_attesa"
      })
    });

    if (!r.ok) throw new Error("HTTP " + r.status);

    document.getElementById("app").innerHTML =
      '<div class="ss">' +
        '<div class="si"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>' +
        '<h2>Grazie!</h2>' +
        '<p>I tuoi dati sono stati inviati correttamente.<br/>Il nostro staff creer\u00e0 la tua scheda al pi\u00f9 presto.</p>' +
        '<div class="sf">' +
          '<svg viewBox="0 0 24 24"><path d="M6 3c1.5 0 3 1.5 3 3S6 12 6 12 3 9 3 6s1.5-3 3-3z"/><path d="M18 3c1.5 0 3 1.5 3 3s-3 6-3 6-3-3-3-6 1.5-3 3-3z"/><path d="M6 12l6 9 6-9"/></svg>' +
          'Ti aspettiamo!' +
        '</div>' +
      '</div>';

  } catch(x) {
    btn.disabled = false;
    btn.textContent = "Invia la mia scheda";
    emsg.textContent = "Si \u00e8 verificato un errore. Riprova tra qualche secondo.";
    ed.style.display = "flex";
  }
};
</script>
</body>
</html>
